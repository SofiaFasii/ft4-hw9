<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="wrapper">
        <h1>Phonebook</h1>
        <form class="form">
            Name
            <input class="inputName" type="text" placeholder="Your name"/>
            Surname
            <input class="inputSurname" type="text" placeholder="Your surname"/>
            Phone
            <input class="inputPhone" type="number" placeholder="Your phone"/>
            Gmail
            <input class="inputGmail" type="gmail" placeholder="Your gmail"/>
            <button type="button" class="btnSave">Save</button>
        </form>
        <ul class="phoneList"></ul>
    </div>
    <script type="module" src="./index.js"></script>
</body>
</html>
